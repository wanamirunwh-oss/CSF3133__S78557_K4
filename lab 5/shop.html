<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Campus Bookstore</title>
    <!-- Google Fonts: Roboto and Merriweather -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shop.css">
</head>
<body>
    <!-- 
      List of Errors Fixed:
      1. shop.html, Line 7: Wrong rel value "stylesheets" (should be "stylesheet").
      2. shop.html, Line 10-12: <style> block was placed before closing </head>. Moved inside <head>.
      3. shop.html, Line 18: Inline style color attribute on <h1> removed because it's handled properly in the internal CSS style block.
      4. shop.css, Line 5: Typo in property name "bacground-position" (should be "background-position").
      5. shop.css, Line 18: Link display set to "inline" instead of "block" causing padding/background issues in navbar.
      6. shop.css, Line 23: Incorrect hover selector "li:a:hover" (should be "li a:hover").
      7. shop.css, Line 27: Typo in property value "border-collapse: collapsed" (should be "collapse").
      8. shop.css, Line 34: Incorrect nth-child selector for even rows "#products tr:nth-child(2)" (should be "nth-child(even)").
      9. shop.css, Line 37: Incorrect hover selector "#products tr:hovered" (should be "tr:hover").
     10. shop.html, Line 21-25: Malformed HTML table cells (missing closing tags or incorrect structure like <tr ><th >Item</th><th >Category</th><th >Price (RM)</th></tr>).
    -->


    <!-- Header Section with Background Image -->
    <header>
        <h1>Campus Bookstore</h1>
        <p>Textbooks, stationery and more for every student.</p>
    </header>

    <!-- Navigation Bar with Active Class -->
    <nav>
        <ul>
            <li><a class="active" href="#home">Home</a></li>
            <li><a href="#books">Books</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Main Content Section -->
    <main>
        <section id="products-section">
            <h2>Featured Products</h2>
            <table id="products">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Category</th>
                        <th class="price-col">Price (RM)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Web Design Basics</td>
                        <td>Textbook</td>
                        <td class="price-col">45.00</td>
                    </tr>
                    <tr>
                        <td>A4 Notebook</td>
                        <td>Stationery</td>
                        <td class="price-col">6.50</td>
                    </tr>
                    <tr>
                        <td>USB Drive 32GB</td>
                        <td>Gadget</td>
                        <td class="price-col">25.00</td>
                    </tr>
                    <tr>
                        <td>Highlighter Set</td>
                        <td>Stationery</td>
                        <td class="price-col">9.90</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 Campus Bookstore</p>
    </footer>
</body>
</html>
